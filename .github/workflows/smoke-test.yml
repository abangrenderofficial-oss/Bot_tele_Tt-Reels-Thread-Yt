name: Downloader Smoke Test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax check
        run: npm run check
      - name: Verify Apple Live Photo runtime routing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const api = await readFile('api/telegram.js', 'utf8');
          const start = api.indexOf('async function processLiveWallpaperButton(callbackQuery, baseUrl) {');
          const end = api.indexOf("async function processStandardDownload(chatId, url, platform, baseUrl, mirrorGroupId = '', from = {}, sourceMessage = null, jobFence = null) {", start);
          if (start < 0 || end < 0) throw new Error('Live Wallpaper callback function not found after postinstall.');

          const live = api.slice(start, end);
          const required = [
            'dispatchHeavyMediaJob({',
            "action: 'live_wallpaper'",
            'callbackMessageId',
            'sourceMessageId: callbackMessageId',
            'heavyWorkerConfigured()',
          ];
          for (const marker of required) {
            if (!live.includes(marker)) throw new Error(`Native Apple Live Photo runtime marker missing: ${marker}`);
          }

          const forbidden = [
            'prepareIPhoneLiveWallpaper({',
            'sendLivePhotoFileUpload(',
            'getTelegramFileSource(fileId)',
          ];
          for (const marker of forbidden) {
            if (live.includes(marker)) throw new Error(`Legacy local Live Wallpaper path leaked into runtime: ${marker}`);
          }

          const recoveryRequired = [
            "from '@vercel/functions'",
            "from '../src/recovery.js'",
            "from '../src/tiktok-rescue.js'",
            "command === '/menu'",
            "command === '/reset'",
            "command === '/resetadmin'",
            'waitUntil(runWebhookUpdate(update, context)',
            'prepareTikTokTelegramRescue(url, configuredUploadLimit())',
            "recovery: 'fast-ack-v1'",
          ];
          for (const marker of recoveryRequired) {
            if (!api.includes(marker)) throw new Error(`Recovery runtime marker missing: ${marker}`);
          }

          const menuStart = api.indexOf('function commandMenuText(userId) {');
          const menuEnd = api.indexOf('async function runWebhookUpdate(update, context) {', menuStart);
          if (menuStart < 0 || menuEnd < 0) throw new Error('Owner-aware menu function missing.');
          const menuSource = api.slice(menuStart, menuEnd);
          const makeMenu = new Function('isResetAdmin', `${menuSource}; return commandMenuText;`);
          const userMenu = makeMenu(() => false)(999);
          const ownerMenu = makeMenu(() => true)(999);

          for (const command of ['/start', '/help', '/menu', '/status <link>', '/reset']) {
            if (!userMenu.includes(command)) throw new Error(`Public menu missing ${command}`);
          }
          for (const command of ['/resetadmin', '/connect', '/disconnect']) {
            if (userMenu.includes(command)) throw new Error(`Public menu leaked owner command ${command}`);
            if (!ownerMenu.includes(command)) throw new Error(`Owner menu missing ${command}`);
          }

          const workflow = await readFile('.github/workflows/heavy-status-hq.yml', 'utf8');
          if (!workflow.includes('runs-on: macos-15')) throw new Error('macOS Live Photo runner missing.');
          if (!workflow.includes('run: python scripts/apple_live_worker.py')) throw new Error('Native Apple Live Photo worker command missing.');

          console.log('Native Apple Live Photo + recovery + owner menu runtime routing: OK');
          NODE
      - name: Resolver smoke test
        run: node scripts/smoke-test.mjs
