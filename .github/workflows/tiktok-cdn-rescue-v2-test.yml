name: TikTok CDN Rescue V2 Validation
on:
  push:
    branches: [fix/tiktok-cdn-rescue-v2]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and apply runtime patches
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Verify TikTok failure-path hardening only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const downloader = await readFile('src/downloader.js', 'utf8');
          const api = await readFile('api/telegram.js', 'utf8');

          const downloaderRequired = [
            'const TIKTOK_BROWSER_USER_AGENT',
            "Referer: canonicalUrl || 'https://www.tiktok.com/'",
            "Accept: 'video/webm,video/mp4,video/*;q=0.9,*/*;q=0.8'",
            'sourceUrl: canonicalUrl',
            'headers: tiktokCdnHeaders',
            'canonicalUrl,',
          ];
          for (const marker of downloaderRequired) {
            if (!downloader.includes(marker)) throw new Error(`Downloader marker missing: ${marker}`);
          }

          const apiRequired = [
            'const rescueSourceUrl = media?.canonicalUrl || url;',
            'prepareTikTokTelegramRescue(rescueSourceUrl, configuredUploadLimit())',
            "command === '/reset'",
            "command === '/resetadmin'",
            "command === '/menu'",
            'await runWebhookUpdate(update, context);',
            "recovery: 'sync-recovery-v2'",
          ];
          for (const marker of apiRequired) {
            if (!api.includes(marker)) throw new Error(`API marker missing: ${marker}`);
          }
          if (api.includes('waitUntil(')) throw new Error('Global background webhook regression detected');
          console.log('TikTok CDN headers + canonical rescue validation: OK');
          NODE
