name: Status HQ Smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/status-hq.js'
      - 'src/downloader.js'
      - 'src/tiktok*.js'
      - 'scripts/status-hq-smoke.mjs'
      - '.github/workflows/status-hq-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Process real TikTok link through single-file Status HQ
        env:
          STATUS_TEST_URL: https://www.tiktok.com/@j_k_123_7/video/7654589734496341262
          STATUS_SOURCE_TIMEOUT_MS: '90000'
          STATUS_ENCODE_TIMEOUT_MS: '300000'
          STATUS_HQ_TARGET_MB: '45'
        run: node scripts/status-hq-smoke.mjs
