name: Diagnose TikTok official resolution
on:
  push:
    branches: [diag/tiktok-official-oembed]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser-session TikTok resolver
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/sharoon7171/tik-tok-downloader.git /tmp/tiktok-browser
          cd /tmp/tiktok-browser
          PORT=3000 npm start >/tmp/tiktok-browser.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          set +e
          curl --max-time 180 -sS -D /tmp/headers.txt -o /tmp/result.bin \
            -H 'Content-Type: application/json' \
            --data '{"input":"https://vt.tiktok.com/ZSqsKvFLE"}' \
            http://127.0.0.1:3000/api/download
          CURL_EXIT=$?
          set -e
          echo "CURL_EXIT=$CURL_EXIT"
          echo '--- RESPONSE HEADERS ---'
          cat /tmp/headers.txt || true
          echo '--- RESPONSE BYTES ---'
          stat -c '%s' /tmp/result.bin || true
          echo '--- RESPONSE PREFIX ---'
          head -c 500 /tmp/result.bin | strings | head -20 || true
          echo '--- SERVER LOG ---'
          cat /tmp/tiktok-browser.log || true
          if grep -qi '^Content-Type: video/mp4' /tmp/headers.txt; then
            test "$(stat -c '%s' /tmp/result.bin)" -gt 100000
            echo 'BROWSER_RESOLVER_VIDEO_OK=true'
          else
            echo 'BROWSER_RESOLVER_VIDEO_OK=false'
            exit 1
          fi
