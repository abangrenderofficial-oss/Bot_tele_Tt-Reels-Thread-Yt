name: Heavy Worker Config Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heavy-worker-config-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MTProto client
        run: python -m pip install --disable-pip-version-check --quiet 'kurigram[fast]==2.2.26'
      - name: Verify Telegram MTProto bot login
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pyrogram import Client

          required = ['TELEGRAM_API_ID', 'TELEGRAM_API_HASH', 'TELEGRAM_BOT_TOKEN']
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing GitHub Actions secrets: ' + ', '.join(missing))

          app = Client(
              'heavy_worker_config_test',
              api_id=int(os.environ['TELEGRAM_API_ID']),
              api_hash=os.environ['TELEGRAM_API_HASH'],
              bot_token=os.environ['TELEGRAM_BOT_TOKEN'],
              in_memory=True,
          )
          with app:
              me = app.get_me()
              if not getattr(me, 'is_bot', False):
                  raise SystemExit('Authenticated Telegram account is not a bot.')
              print(f'MTProto bot login OK: id={me.id}, username=@{me.username or "unknown"}')
          PY
