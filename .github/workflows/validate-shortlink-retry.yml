name: Validate TikWM retry matrix
on:
  push:
    branches: [fix/tikwm-shortlink-retry-matrix]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: grep -q "TikWM retry matrix" src/downloader.js
      - run: echo retry-matrix-validation
