name: m129-a

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: Telegram chat ID
        required: true
        type: string
      user_id:
        description: Telegram user ID for completion tracking
        required: false
        default: '0'
        type: string
      video_file_id:
        description: Telegram Bot API video file_id
        required: true
        type: string
      file_size:
        description: Source video size in bytes
        required: false
        default: '0'
        type: string
      action:
        description: status_hq, status_hq_android or live_wallpaper
        required: true
        default: status_hq
        type: string
      source_kind:
        description: link or gallery
        required: false
        default: link
        type: string
      progress_message_id:
        description: Bot progress message ID
        required: false
        default: '0'
        type: string
      source_message_id:
        description: Original Gallery message ID
        required: false
        default: '0'
        type: string
      completion_callback_url:
        description: Bot callback URL used after Premium HQ send succeeds
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: heavy-media-${{ inputs.action }}-${{ inputs.chat_id }}
  cancel-in-progress: false

jobs:
  status_hq:
    if: ${{ inputs.action == 'status_hq' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HEAVY_CHAT_ID: ${{ inputs.chat_id }}
      HEAVY_VIDEO_FILE_ID: ${{ inputs.video_file_id }}
      HEAVY_FILE_SIZE: ${{ inputs.file_size }}
      HEAVY_ACTION: status_hq
      HEAVY_PROGRESS_MESSAGE_ID: ${{ inputs.progress_message_id }}
      HEAVY_SOURCE_MESSAGE_ID: ${{ inputs.source_message_id }}
      HEAVY_VIDEO_MAX_MB: '500'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install MTProto client
        run: python -m pip install --disable-pip-version-check --quiet 'kurigram[fast]==2.2.26' requests

      - name: Process Status HQ
        run: python scripts/heavy_status_worker.py

      - name: Record Premium HQ delivery
        if: ${{ success() && inputs.completion_callback_url != '' && inputs.user_id != '0' }}
        shell: bash
        env:
          COMPLETION_CALLBACK_URL: ${{ inputs.completion_callback_url }}
          COMPLETION_CHAT_ID: ${{ inputs.chat_id }}
          COMPLETION_USER_ID: ${{ inputs.user_id }}
          COMPLETION_SIGNING_SECRET: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          payload="${COMPLETION_CHAT_ID}:${COMPLETION_USER_ID}:status_hq:v1"
          signature="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$COMPLETION_SIGNING_SECRET" -hex | awk '{print $2}')"
          if ! curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Content-Type: application/json' \
            -H "x-heavy-worker-signature: ${signature}" \
            --data "{\"chat_id\":\"${COMPLETION_CHAT_ID}\",\"user_id\":\"${COMPLETION_USER_ID}\",\"event\":\"status_hq\"}" \
            "$COMPLETION_CALLBACK_URL"; then
            echo '::warning::Premium HQ was delivered, but completion callback failed after retries.'
          fi

  status_hq_android:
    if: ${{ inputs.action == 'status_hq_android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HEAVY_CHAT_ID: ${{ inputs.chat_id }}
      HEAVY_VIDEO_FILE_ID: ${{ inputs.video_file_id }}
      HEAVY_FILE_SIZE: ${{ inputs.file_size }}
      HEAVY_PROGRESS_MESSAGE_ID: ${{ inputs.progress_message_id }}
      HEAVY_SOURCE_MESSAGE_ID: ${{ inputs.source_message_id }}
      HEAVY_VIDEO_MAX_MB: '500'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install MTProto client
        run: python -m pip install --disable-pip-version-check --quiet 'kurigram[fast]==2.2.26' requests

      - name: Process Android Status HQ Beta
        run: python scripts/heavy_status_android_worker.py

  live_wallpaper:
    if: ${{ inputs.action == 'live_wallpaper' }}
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HEAVY_CHAT_ID: ${{ inputs.chat_id }}
      HEAVY_VIDEO_FILE_ID: ${{ inputs.video_file_id }}
      HEAVY_FILE_SIZE: ${{ inputs.file_size }}
      HEAVY_ACTION: live_wallpaper
      HEAVY_SOURCE_KIND: ${{ inputs.source_kind }}
      HEAVY_PROGRESS_MESSAGE_ID: ${{ inputs.progress_message_id }}
      HEAVY_SOURCE_MESSAGE_ID: ${{ inputs.source_message_id }}
      HEAVY_VIDEO_MAX_MB: '500'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q hevc_videotoolbox
          swift --version

      - name: Install MTProto client
        run: python -m pip install --disable-pip-version-check --quiet 'kurigram[fast]==2.2.26' requests

      - name: Process native Apple Live Photo
        run: python scripts/apple_live_worker.py
