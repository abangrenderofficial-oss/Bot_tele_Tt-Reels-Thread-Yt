name: m129-a

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: Telegram chat ID
        required: true
        type: string
      video_file_id:
        description: Telegram Bot API video file_id
        required: true
        type: string
      file_size:
        description: Source video size in bytes
        required: false
        default: '0'
        type: string
      action:
        description: status_hq, status_hq_android or live_wallpaper
        required: true
        default: status_hq
        type: string
      source_kind:
        description: link or gallery
        required: false
        default: link
        type: string
      progress_message_id:
        description: Bot progress message ID
        required: false
        default: '0'
        type: string
      source_message_id:
        description: Original Gallery message ID
        required: false
        default: '0'
        type: string
      completion_url:
        description: Signed callback URL after Premium+ HQ is sent
        required: false
        default: ''
        type: string
      completion_id:
        description: Idempotency ID for Premium+ HQ completion
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: heavy-media-${{ inputs.action }}-${{ inputs.chat_id }}
  cancel-in-progress: false

jobs:
  status_hq:
    if: ${{ inputs.action == 'status_hq' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HEAVY_CHAT_ID: ${{ inputs.chat_id }}
      HEAVY_VIDEO_FILE_ID: ${{ inputs.video_file_id }}
      HEAVY_FILE_SIZE: ${{ inputs.file_size }}
      HEAVY_ACTION: status_hq
      HEAVY_PROGRESS_MESSAGE_ID: ${{ inputs.progress_message_id }}
      HEAVY_SOURCE_MESSAGE_ID: ${{ inputs.source_message_id }}
      HEAVY_COMPLETION_URL: ${{ inputs.completion_url }}
      HEAVY_COMPLETION_ID: ${{ inputs.completion_id }}
      HEAVY_VIDEO_MAX_MB: '150'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install MTProto client
        run: python -m pip install --disable-pip-version-check --quiet 'kurigram[fast]==2.2.26' requests

      - name: Process Status HQ
        run: python scripts/heavy_status_worker.py

      - name: Confirm Premium+ HQ completion
        if: ${{ success() && inputs.completion_url != '' && inputs.completion_id != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = os.environ['HEAVY_COMPLETION_URL'].strip()
          chat_id = os.environ['HEAVY_CHAT_ID'].strip()
          completion_id = os.environ['HEAVY_COMPLETION_ID'].strip()
          action = 'status_hq'
          token = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          signed = f'{chat_id}|{completion_id}|{action}'.encode()
          signature = hmac.new(token.encode(), signed, hashlib.sha256).hexdigest()
          body = json.dumps({
              'chat_id': chat_id,
              'completion_id': completion_id,
              'action': action,
              'signature': signature,
          }).encode()

          last_error = None
          for attempt in range(1, 6):
              try:
                  request = urllib.request.Request(
                      url,
                      data=body,
                      headers={'Content-Type': 'application/json'},
                      method='POST',
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = response.read().decode('utf-8', 'replace')
                      if response.status == 200:
                          print(f'Premium+ completion confirmed: {payload}', flush=True)
                          raise SystemExit(0)
                      last_error = RuntimeError(f'HTTP {response.status}: {payload[:300]}')
              except Exception as exc:
                  last_error = exc
                  print(f'completion callback attempt {attempt} failed: {exc}', flush=True)
                  if attempt < 5:
                      time.sleep(attempt * 2)
          raise SystemExit(f'Premium+ completion callback failed after retries: {last_error}')
          PY

  status_hq_android:
    if: ${{ inputs.action == 'status_hq_android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HEAVY_CHAT_ID: ${{ inputs.chat_id }}
      HEAVY_VIDEO_FILE_ID: ${{ inputs.video_file_id }}
      HEAVY_FILE_SIZE: ${{ inputs.file_size }}
      HEAVY_PROGRESS_MESSAGE_ID: ${{ inputs.progress_message_id }}
      HEAVY_SOURCE_MESSAGE_ID: ${{ inputs.source_message_id }}
      HEAVY_VIDEO_MAX_MB: '150'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install MTProto client
        run: python -m pip install --disable-pip-version-check --quiet 'kurigram[fast]==2.2.26' requests

      - name: Process Android Status HQ Beta
        run: python scripts/heavy_status_android_worker.py

  live_wallpaper:
    if: ${{ inputs.action == 'live_wallpaper' }}
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HEAVY_CHAT_ID: ${{ inputs.chat_id }}
      HEAVY_VIDEO_FILE_ID: ${{ inputs.video_file_id }}
      HEAVY_FILE_SIZE: ${{ inputs.file_size }}
      HEAVY_ACTION: live_wallpaper
      HEAVY_SOURCE_KIND: ${{ inputs.source_kind }}
      HEAVY_PROGRESS_MESSAGE_ID: ${{ inputs.progress_message_id }}
      HEAVY_SOURCE_MESSAGE_ID: ${{ inputs.source_message_id }}
      HEAVY_VIDEO_MAX_MB: '150'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q hevc_videotoolbox
          swift --version

      - name: Install MTProto client
        run: python -m pip install --disable-pip-version-check --quiet 'kurigram[fast]==2.2.26' requests

      - name: Process native Apple Live Photo
        run: python scripts/apple_live_worker.py
