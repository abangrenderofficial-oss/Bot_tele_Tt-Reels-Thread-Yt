name: Apple Live Photo Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apple_live_photo_pair.swift'
      - 'scripts/apple_live_worker.py'
      - 'scripts/prepare_wallpaper_video.py'
      - '.github/workflows/heavy-status-hq.yml'
      - '.github/workflows/apple-live-photo-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep hevc_videotoolbox
          swift --version

      - name: Check wallpaper worker syntax
        run: |
          python3 -m py_compile scripts/apple_live_worker.py
          python3 -m py_compile scripts/prepare_wallpaper_video.py

      - name: Build native Apple pairer
        run: swiftc scripts/apple_live_photo_pair.swift -o /tmp/apple-live-pair

      - name: Generate HEVC 60fps wallpaper motion
        shell: bash
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i 'testsrc2=size=1280x720:rate=60' \
            -t 4 \
            -c:v libx264 -pix_fmt yuv420p -b:v 3000k \
            /tmp/source.mp4

          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/source.mp4 -t 1.5 \
            -map 0:v:0 -an \
            -vf 'scale=1080:1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920,setsar=1,fps=60,setpts=PTS-STARTPTS' \
            -c:v hevc_videotoolbox -profile:v main -pix_fmt yuv420p \
            -tag:v hvc1 -b:v 5000k -g 60 \
            -map_metadata -1 -video_track_timescale 600 \
            -f mov /tmp/raw.mov

          ffmpeg -y -hide_banner -loglevel error \
            -ss 0 -i /tmp/raw.mov -frames:v 1 -q:v 2 /tmp/raw.jpg

      - name: Validate wallpaper media profile
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output([
              'ffprobe', '-v', 'error', '-select_streams', 'v:0',
              '-show_entries',
              'stream=width,height,r_frame_rate,time_base,codec_name,codec_tag_string:format=duration',
              '-of', 'json', '/tmp/raw.mov'
          ], text=True))
          stream = payload['streams'][0]
          duration = float(payload['format']['duration'])
          print(stream, 'duration=', duration)
          assert stream['width'] == 1080
          assert stream['height'] == 1920
          assert stream['codec_name'] == 'hevc'
          assert stream['codec_tag_string'] == 'hvc1'
          assert stream['r_frame_rate'] == '60/1'
          assert stream['time_base'] == '1/600'
          assert 1.35 <= duration <= 1.60
          PY

      - name: Inject wallpaper mebx and cdsc structure
        run: |
          python3 scripts/prepare_wallpaper_video.py /tmp/raw.mov /tmp/prepared.mov
          test -s /tmp/prepared.mov
          python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/prepared.mov').read_bytes()
          required = [
              b'com.apple.quicktime.live-photo-info',
              b'com.apple.quicktime.live-photo-still-image-transform',
              b'com.apple.quicktime.still-image-time',
          ]
          for key in required:
              assert key in data, key
          assert data.count(b'cdsc') >= 2, data.count(b'cdsc')
          print('prepared cdsc=', data.count(b'cdsc'))
          PY

      - name: Pair without dropping wallpaper tracks
        run: |
          /tmp/apple-live-pair /tmp/raw.jpg /tmp/prepared.mov /tmp/paired.jpg /tmp/paired.mov
          test -s /tmp/paired.jpg
          test -s /tmp/paired.mov
          python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/paired.mov').read_bytes()
          assert data.count(b'cdsc') >= 2, data.count(b'cdsc')
          assert b'com.apple.quicktime.live-photo-info' in data
          assert b'com.apple.quicktime.live-photo-still-image-transform' in data
          print('paired cdsc=', data.count(b'cdsc'))
          PY
          ls -lh /tmp/paired.jpg /tmp/paired.mov
