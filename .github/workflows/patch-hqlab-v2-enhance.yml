name: Patch HQ Lab V2 Enhance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-hqlab-v2-enhance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Match V2 enhancement to Premium Plus
        run: |
          set -e
          sed -i "s/hqdn3d=0.06:0.06:0.24:0.24/hqdn3d=0.18:0.18:0.70:0.70/" src/hq-lab.js
          sed -i "s/unsharp=5:5:0.223:3:3:0.0/unsharp=5:5:0.18:3:3:0.0/" src/hq-lab.js
          sed -i "s/eq=contrast=1.009:saturation=1.011/eq=contrast=1.012:saturation=1.015/" src/hq-lab.js
          sed -i "s/Premium+ HQ V2 = formula V2 dengan enhancement terbaru./Premium+ HQ V2 = enhancement 100% sama seperti Premium+; encoder\/bitrate V2 kekal./" src/features/hq-lab.js
          git config user.name "abangrenderofficial-oss"
          git config user.email "abangrenderofficial@gmail.com"
          git add src/hq-lab.js src/features/hq-lab.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Match HQ Lab V2 enhancement to Premium Plus"
          git push origin main
