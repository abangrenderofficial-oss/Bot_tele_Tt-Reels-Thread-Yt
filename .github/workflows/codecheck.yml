name: Code Syntax Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without postinstall
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check heavy worker Python syntax
        run: python3 -m py_compile scripts/heavy_status_worker.py
