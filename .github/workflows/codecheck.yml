name: Code Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without postinstall
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check gallery upload 200MB boundary
        run: node scripts/gallery-upload-limit-selftest.mjs
      - name: Check channel gate threshold
        run: node scripts/channel-gate-threshold-selftest.mjs
      - name: Verify channel membership access
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/channel-membership-selftest.mjs
      - name: Check media worker Python syntax
        run: python3 -m py_compile scripts/heavy_status_worker.py scripts/apple_live_worker.py scripts/prepare_wallpaper_video.py
