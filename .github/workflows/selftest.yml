name: Downloader Self Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Vercel deployment
        run: sleep 45

      - name: Test downloader cases
        shell: bash
        run: |
          set -u
          BASE='https://mdab-129.vercel.app/api/diagnostic'
          FAIL=0
          for CASE in tiktok reels youtube threads; do
            echo "=== $CASE ==="
            OUT=''
            for TRY in 1 2 3 4 5; do
              OUT=$(curl -fsS --max-time 70 "$BASE?case=$CASE" || true)
              echo "try=$TRY $OUT"
              if echo "$OUT" | grep -q '"case"'; then break; fi
              sleep 15
            done
            if ! echo "$OUT" | grep -q '"ok":true'; then
              FAIL=1
            fi
          done
          exit $FAIL
