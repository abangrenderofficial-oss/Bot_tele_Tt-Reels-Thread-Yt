name: Debug Current TikTok URL
on:
  push:
    branches: [debug/tiktok-current-url]
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fallback resolver services
        env:
          TEST_URL: https://vt.tiktok.com/ZSqsKvFLE
        run: |
          node --input-type=module <<'NODE'
          const input=process.env.TEST_URL;
          async function hit(label,url){
            try{const r=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0',Accept:'application/json,text/plain,*/*'},signal:AbortSignal.timeout(25000)});const t=await r.text();console.log(label,'status',r.status,'body',t.slice(0,2200));}
            catch(e){console.log(label,'ERR',e.name,e.message);}
          }
          const clip=new URL('https://clipx.zamdev.workers.dev/'); clip.searchParams.set('url',input); await hit('CLIPX',clip);
          const go=new URL('https://godownloader.com/api/tiktok-no-watermark-free'); go.searchParams.set('url',input); go.searchParams.set('key','godownloader.com'); await hit('GODOWNLOADER',go);
          const save=new URL('https://www.tikwm.com/api/'); save.searchParams.set('url',input); save.searchParams.set('hd','1'); await hit('TIKWM',save);
          NODE
