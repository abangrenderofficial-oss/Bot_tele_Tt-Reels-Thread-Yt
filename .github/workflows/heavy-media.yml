name: Heavy Media Worker

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: Telegram chat ID
        required: true
        type: string
      video_file_id:
        description: Telegram Bot API video file_id
        required: true
        type: string
      file_size:
        description: Source video size in bytes
        required: false
        default: '0'
        type: string
      action:
        description: status_hq or live_wallpaper
        required: true
        default: status_hq
        type: string
      progress_message_id:
        description: Bot progress message ID
        required: false
        default: '0'
        type: string
      source_message_id:
        description: Original gallery message ID
        required: false
        default: '0'
        type: string

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ inputs.chat_id }}
      VIDEO_FILE_ID: ${{ inputs.video_file_id }}
      FILE_SIZE: ${{ inputs.file_size }}
      ACTION: ${{ inputs.action }}
      PROGRESS_MESSAGE_ID: ${{ inputs.progress_message_id }}
      SOURCE_MESSAGE_ID: ${{ inputs.source_message_id }}
      HEAVY_MEDIA_MAX_MB: '250'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install MTProto worker dependencies
        run: python -m pip install --disable-pip-version-check 'kurigram[fast]==2.2.26' requests

      - name: Process Telegram media
        run: python workers/heavy_media_worker.py
