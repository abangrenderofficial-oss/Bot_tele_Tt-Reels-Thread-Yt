name: Hotfix Sync Webhook Validation
on:
  push:
    branches: [hotfix/restore-sync-webhook]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and apply runtime patches
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Verify synchronous webhook hotfix
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const api = await readFile('api/telegram.js', 'utf8');
          if (!api.includes('await runWebhookUpdate(update, context);')) throw new Error('synchronous webhook processing missing');
          if (api.includes('waitUntil(runWebhookUpdate(update, context)')) throw new Error('background webhook processing still present');
          if (api.includes("from '@vercel/functions'")) throw new Error('waitUntil import still present');
          if (!api.includes("command === '/reset'")) throw new Error('/reset missing');
          if (!api.includes("command === '/resetadmin'")) throw new Error('/resetadmin missing');
          if (!api.includes("command === '/menu'")) throw new Error('/menu missing');
          if (!api.includes('prepareTikTokTelegramRescue(url, configuredUploadLimit())')) throw new Error('TikTok rescue missing');
          if (!api.includes('dispatchHeavyMediaJob({')) throw new Error('heavy media routing missing');
          if (!api.includes("recovery: 'sync-recovery-v2'")) throw new Error('sync recovery marker missing');
          console.log('Synchronous webhook hotfix validation: OK');
          NODE
