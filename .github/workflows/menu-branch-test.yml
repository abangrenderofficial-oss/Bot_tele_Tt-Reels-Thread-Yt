name: Owner Menu Branch Validation
on:
  push:
    branches: [feature/owner-aware-menu]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and apply runtime patches
        run: npm install --no-audit --no-fund
      - name: Syntax check final runtime
        run: npm run check
      - name: Verify owner-aware menu and preserved downloader behavior
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const api = await readFile('api/telegram.js', 'utf8');
          const menuStart = api.indexOf('function commandMenuText(userId) {');
          const menuEnd = api.indexOf('async function runWebhookUpdate(update, context) {', menuStart);
          if (menuStart < 0 || menuEnd < 0) throw new Error('Menu runtime function missing');

          const menuSource = api.slice(menuStart, menuEnd);
          const makeMenu = new Function('isResetAdmin', `${menuSource}; return commandMenuText;`);
          const userMenu = makeMenu(() => false)(999);
          const ownerMenu = makeMenu(() => true)(999);

          for (const command of ['/start', '/help', '/menu', '/status <link>', '/reset']) {
            if (!userMenu.includes(command)) throw new Error(`Public menu missing ${command}`);
          }
          for (const command of ['/resetadmin', '/connect', '/disconnect']) {
            if (userMenu.includes(command)) throw new Error(`Public menu leaked owner command ${command}`);
            if (!ownerMenu.includes(command)) throw new Error(`Owner menu missing ${command}`);
          }

          const requiredRuntime = [
            "command === '/menu'",
            "menu: isResetAdmin(userId) ? 'owner' : 'user'",
            "command === '/reset'",
            "command === '/resetadmin'",
            'prepareTikTokTelegramRescue(url, configuredUploadLimit())',
            'dispatchHeavyMediaJob({',
            '📥 Social Downloader Bot',
            'Bot akan cuba hantar semula media dalam chat dan user boleh download.',
            'Boleh juga upload media video atau photo dari gallery untuk:',
          ];
          for (const marker of requiredRuntime) {
            if (!api.includes(marker)) throw new Error(`Runtime marker missing: ${marker}`);
          }

          console.log('Owner-aware command menu validation: OK');
          NODE
