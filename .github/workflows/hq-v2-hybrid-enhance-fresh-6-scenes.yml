name: HQ V2 Hybrid Enhance - Fresh 6 Scenes

on:
  push:
    branches:
      - hq-lab-chat-test-20260919
    paths:
      - .github/workflows/hq-v2-hybrid-enhance-fresh-6-scenes.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - folder: 01_Architecture
            id: '30118971'
            label: 'Architecture - Modern Facade'
            page: 'https://www.pexels.com/video/modern-architectural-facade-under-blue-sky-30118971/'
            color_enhance: 'false'
          - folder: 02_Nature
            id: '32099665'
            label: 'Nature - Misty Forest'
            page: 'https://www.pexels.com/video/eerie-misty-forest-with-tall-trees-32099665/'
            color_enhance: 'false'
          - folder: 03_Close_Up_Face
            id: '5534415'
            label: 'Close Up Face - Skin / Wrinkle Detail'
            page: 'https://www.pexels.com/video/close-up-view-of-a-person-s-eyes-and-face-5534415/'
            color_enhance: 'false'
          - folder: 04_Texture
            id: '30104840'
            label: 'Texture - Fabric Macro'
            page: 'https://www.pexels.com/video/close-up-fabric-texture-with-subtle-lighting-30104840/'
            color_enhance: 'false'
          - folder: 05_Color_Enhance
            id: '31003253'
            label: 'Color Enhance - Neon Motion'
            page: 'https://www.pexels.com/video/abstract-neon-light-geometric-animation-31003253/'
            color_enhance: 'true'
          - folder: 06_Jungle_Waterfall
            id: '32458319'
            label: 'Jungle + Waterfall - Tropical Waterfall'
            page: 'https://www.pexels.com/video/stunning-tropical-waterfall-in-lush-jungle-32458319/'
            color_enhance: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg and curl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl

      - name: Download fresh source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source out/${{ matrix.folder }}
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://www.pexels.com/download/video/${{ matrix.id }}/' \
            -o source/input.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate:format=duration,bit_rate \
            -of default=noprint_wrappers=1 source/input.mp4

      - name: Render Premium HQ vs Premium+ HQ vs V2 Hybrid Enhance
        shell: bash
        run: |
          set -euo pipefail
          OUT='out/${{ matrix.folder }}'
          LABEL='${{ matrix.label }}'
          PAGE='${{ matrix.page }}'

          EXTRA=''
          if [ '${{ matrix.color_enhance }}' = 'true' ]; then
            EXTRA=',eq=contrast=1.025:saturation=1.14:brightness=0.004'
          fi

          PSCALE="scale='if(gte(iw,ih),1280,-2)':'if(gte(iw,ih),-2,1280)':flags=lanczos,scale=trunc(iw/2)*2:trunc(ih/2)*2"
          COMMON=( -y -hide_banner -loglevel error -nostdin -ss 1 -t 8 -i source/input.mp4 -map 0:v:0 -map '0:a:0?' )
          AUDIO=( -c:a aac -profile:a aac_low -ar 48000 -ac 2 -b:a 128k -movflags +faststart -map_metadata -1 -threads 1 )

          # Locked Premium HQ control.
          PENC=( -c:v libx264 -preset fast -pix_fmt yuv420p -b:v 3200k -maxrate 3776k -bufsize 7552k -profile:v main -level:v 3.1 -tag:v avc1 -g 60 -keyint_min 30 -sc_threshold 0 )

          # Locked Premium+ HQ control.
          PPENC=( -c:v libx264 -preset veryfast -pix_fmt yuv420p -b:v 3350k -maxrate 3900k -bufsize 7800k -profile:v main -level:v 3.1 -tag:v avc1 -g 60 -keyint_min 30 -sc_threshold 0 )

          # V2 preservation encoder. Keep V2 encoder/bitrate direction; only add light Premium-style polish.
          V2ENC=( -c:v libx264 -preset fast -pix_fmt yuv420p -b:v 4300k -maxrate 4650k -bufsize 9300k -profile:v main -level:v 3.1 -tag:v avc1 -g 60 -keyint_min 30 -sc_threshold 0 )

          # 1) Premium HQ: natural control, no ordinary enhancement.
          ffmpeg "${COMMON[@]}" \
            -vf "$PSCALE,setsar=1,fps=30000/1001$EXTRA" \
            "${PENC[@]}" "${AUDIO[@]}" \
            "$OUT/01_Premium_HQ.mp4"

          # 2) Premium+ HQ: original locked enhancement recipe.
          ffmpeg "${COMMON[@]}" \
            -vf "$PSCALE,setsar=1,fps=30000/1001,hqdn3d=0.18:0.18:0.70:0.70,unsharp=5:5:0.18:3:3:0.0,eq=contrast=1.012:saturation=1.015$EXTRA" \
            "${PPENC[@]}" "${AUDIO[@]}" \
            "$OUT/02_Premium_Plus_HQ.mp4"

          # 3) V2 Hybrid Enhance: preserve V2 detail path but push the Premium+ look closer.
          #    Denoise remains light; contrast/saturation moved closer to Premium+; V2 sharpen stays 0.223.
          ffmpeg "${COMMON[@]}" \
            -vf "$PSCALE,setsar=1,fps=30000/1001,hqdn3d=0.06:0.06:0.24:0.24,unsharp=5:5:0.223:3:3:0.0,eq=contrast=1.009:saturation=1.011$EXTRA" \
            "${V2ENC[@]}" "${AUDIO[@]}" \
            "$OUT/03_V2_Hybrid_Enhance.mp4"

          cat > "$OUT/README.txt" <<EOF
          $LABEL
          Source: $PAGE
          Pexels ID: ${{ matrix.id }}

          Same source and exact same 8-second segment for all 3 outputs.

          01 Premium HQ
          - No ordinary denoise / sharpen / contrast / saturation enhancement
          - x264 fast, 3200k, maxrate 3776k, bufsize 7552k

          02 Premium+ HQ
          - hqdn3d 0.18:0.18:0.70:0.70
          - unsharp 5:5:0.18
          - contrast 1.012
          - saturation 1.015
          - x264 veryfast, 3350k, maxrate 3900k, bufsize 7800k

          03 V2 Hybrid Enhance
          - hqdn3d 0.06:0.06:0.24:0.24
          - unsharp 5:5:0.223
          - contrast 1.009
          - saturation 1.011
          - x264 fast, 4300k, maxrate 4650k, bufsize 9300k

          Goal: move V2 visual polish closer to Premium+ while keeping enhancement lighter than Premium+.
          IMPORTANT: post-WhatsApp scores are unknown until the returned Status files are measured.
          EOF

      - name: Upload scene
        uses: actions/upload-artifact@v4
        with:
          name: HQHYBRID_${{ matrix.folder }}
          path: out/${{ matrix.folder }}/
          if-no-files-found: error
          retention-days: 1
