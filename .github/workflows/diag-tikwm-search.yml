name: Probe SnapTik library
on:
  push:
    branches: [diag/tikwm-search-recover]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TikTok downloader probe
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/krypton-byte/tiktok-downloader.git
      - name: Probe exact TikTok short link
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import traceback
          from tiktok_downloader import snaptik
          link='https://vt.tiktok.com/ZSqsKvFLE'
          try:
              media=snaptik(link)
              print('SNAPTIK_COUNT', len(media))
              for i,m in enumerate(media):
                  print('ITEM', i, repr(m))
                  for key in ('url','download_url','type'):
                      try: print(key, getattr(m,key,None))
                      except Exception as e: print(key,'ERR',e)
          except Exception as e:
              print('SNAPTIK_ERR',type(e).__name__,str(e))
              traceback.print_exc()
          PY
      - run: echo snaptik-library-v1
