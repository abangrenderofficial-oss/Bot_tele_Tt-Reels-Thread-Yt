name: Probe ClipX and Cobalt TikTok resolvers
on:
  push:
    branches: [diag/tikwm-search-recover]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe exact TikTok short link
        timeout-minutes: 5
        run: |
          node --input-type=module <<'NODE'
          const link='https://vt.tiktok.com/ZSqsKvFLE';
          const ua='AbangRenderBot/1.0 (+https://github.com/abangrenderofficial-oss/Bot_tele_Tt-Reels-Thread-Yt)';
          async function clip(){
            try {
              const u='https://clipx.zamdev.workers.dev/?url='+encodeURIComponent(link);
              const r=await fetch(u,{headers:{accept:'application/json','user-agent':ua},signal:AbortSignal.timeout(30000)});
              console.log('CLIPX',r.status,(await r.text()).slice(0,5000));
            } catch(e) { console.log('CLIPX_ERR',e?.message||e); }
          }
          async function cobalt(api){
            try {
              const r=await fetch('https://'+api+'/',{method:'POST',headers:{accept:'application/json','content-type':'application/json','user-agent':ua},body:JSON.stringify({url:link}),signal:AbortSignal.timeout(30000)});
              console.log('COBALT',api,r.status,(await r.text()).slice(0,3000));
            } catch(e) { console.log('COBALT_ERR',api,e?.message||e); }
          }
          await clip();
          for(const api of ['cobalt-api.meowing.de','cobalt-backend.canine.tools','capi.3kh0.net','kityune.imput.net','nachos.imput.net','sunny.imput.net','blossom.imput.net','downloadapi.stuff.solutions']) await cobalt(api);
          NODE
      - run: echo clipx-cobalt-v1
