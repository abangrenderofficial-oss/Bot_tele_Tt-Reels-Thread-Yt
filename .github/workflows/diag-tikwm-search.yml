name: Call discovered TikTok helper endpoints
on:
  push:
    branches: [diag/tikwm-search-recover]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect endpoint call shapes and test exact short link
        timeout-minutes: 5
        run: |
          node --input-type=module <<'NODE'
          const target='https://vt.tiktok.com/ZSqsKvFLE';
          const ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36';
          const timeout=()=>AbortSignal.timeout(12000);
          async function scripts(pageUrl){
            const r=await fetch(pageUrl,{headers:{'user-agent':ua},signal:timeout()});
            const html=await r.text();
            return [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>new URL(m[1],pageUrl).toString());
          }
          async function context(pageUrl,needle){
            for(const s of await scripts(pageUrl)){
              try{
                const r=await fetch(s,{headers:{'user-agent':ua},signal:timeout()});
                const js=await r.text();
                let from=0, n=0;
                while((from=js.indexOf(needle,from))>=0 && n<5){
                  console.log('\nCTX',pageUrl,needle,'SCRIPT',s,'\n',js.slice(Math.max(0,from-1000),Math.min(js.length,from+1800)));
                  from+=needle.length;n++;
                }
              }catch(e){console.log('CTX_ERR',s,e?.message||e)}
            }
          }
          async function call(name,url,opts={}){
            try{
              const r=await fetch(url,{...opts,headers:{'user-agent':ua,accept:'application/json,text/plain,*/*',...(opts.headers||{})},signal:timeout()});
              const text=await r.text();
              console.log('\nCALL',name,'HTTP',r.status,'TYPE',r.headers.get('content-type'),'BODY',text.slice(0,8000));
            }catch(e){console.log('\nCALL_ERR',name,e?.stack||e)}
          }
          await context('https://peektok.net/copy-tiktok-link/','/api/lookup');
          await context('https://watchtiktokwithoutapp.com/','/api/expand');
          await call('PEEK_LOOKUP_POST_URL','https://peektok.net/api/lookup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:target})});
          await call('PEEK_LOOKUP_POST_QUERY','https://peektok.net/api/lookup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:target})});
          await call('PEEK_LOOKUP_POST_INPUT','https://peektok.net/api/lookup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({input:target})});
          await call('WATCH_EXPAND_POST_URL','https://watchtiktokwithoutapp.com/api/expand',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:target})});
          await call('WATCH_EXPAND_POST_LINK','https://watchtiktokwithoutapp.com/api/expand',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({link:target})});
          await call('WATCH_EXPAND_FORM','https://watchtiktokwithoutapp.com/api/expand',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({url:target})});
          NODE
      - run: echo discovered-helper-call-v1
