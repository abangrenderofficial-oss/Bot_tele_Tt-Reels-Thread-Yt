name: Probe GoDownloader TikTok resolver
on:
  push:
    branches: [diag/tikwm-search-recover]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe exact TikTok short link
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          const link='https://vt.tiktok.com/ZSqsKvFLE';
          const ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36';
          const tests=[
            ['GODOWN','https://godownloader.com/api/tiktok-no-watermark-free?url='+encodeURIComponent(link)+'&key=godownloader.com'],
            ['PREXZY','https://prexzyapis.com/api/download/tiktok?url='+encodeURIComponent(link)],
            ['PREXZY2','https://prexzyapis.com/downloader/tiktok?url='+encodeURIComponent(link)]
          ];
          for(const [name,url] of tests){
            try{
              const r=await fetch(url,{headers:{accept:'application/json,*/*','user-agent':ua},redirect:'follow',signal:AbortSignal.timeout(30000)});
              console.log(name,r.status,r.url,(await r.text()).slice(0,6000));
            }catch(e){console.log(name+'_ERR',e?.message||e)}
          }
          NODE
      - run: echo godown-probe-v1
