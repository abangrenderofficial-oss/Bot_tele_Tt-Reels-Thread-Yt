name: Diagnose TikTok short-link resolution
on:
  push:
    branches: [diag/tikwm-search-recover]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe exact short link
        run: |
          node --input-type=module <<'NODE'
          const link='https://vt.tiktok.com/ZSqsKvFLE';
          const uas={
            desktop:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36',
            iphone:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.6 Mobile/15E148 Safari/604.1',
            android:'Mozilla/5.0 (Linux; Android 15; Pixel 9 Pro) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36',
            googlebot:'Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 Chrome/41.0.2272.96 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)',
            facebook:'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)',
            twitter:'Twitterbot/1.0',
            tiktokapp:'com.zhiliaoapp.musically/2023600030 (Linux; U; Android 13; en_US; Pixel 7; Build/TQ3A.230805.001; Cronet/TTNetVersion:4d8a3f91 2023-08-01 QuicVersion:47946d2a 2023-07-11)'
          };
          for (const [name,ua] of Object.entries(uas)) {
            try {
              const r=await fetch(link,{redirect:'manual',headers:{'user-agent':ua,'accept-language':'en-US,en;q=0.9',accept:'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'}});
              console.log('REDIRECT',name,r.status,r.headers.get('location'),'SETCOOKIE',String(r.headers.get('set-cookie')||'').slice(0,180));
            } catch(e) { console.log('REDIRECT_ERR',name,e?.message||e); }
          }

          for (const input of [link, link+'/', link+'?is_from_webapp=1&sender_device=pc', link+'?_r=1']) {
            try {
              const u='https://www.tiktok.com/oembed?url='+encodeURIComponent(input);
              const r=await fetch(u,{headers:{'user-agent':uas.desktop,accept:'application/json'}});
              const txt=await r.text();
              console.log('OEMBED',input,r.status,txt.slice(0,2000));
            } catch(e) { console.log('OEMBED_ERR',input,e?.message||e); }
          }
          NODE
      - run: echo tiktok-resolution-probe-v1
