name: Inspect raw TikTok short-link response
on:
  push:
    branches: [diag/tikwm-search-recover]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dump redirect response safely
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          const target='https://vt.tiktok.com/ZSqsKvFLE';
          const uas=[
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36',
            'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.6 Mobile/15E148 Safari/604.1'
          ];
          for(const ua of uas){
            const r=await fetch(target,{redirect:'manual',headers:{'user-agent':ua,accept:'*/*','accept-language':'en-US,en;q=0.9'},signal:AbortSignal.timeout(12000)});
            const headers=Object.fromEntries([...r.headers.entries()].filter(([k])=>!['set-cookie'].includes(k.toLowerCase())));
            const body=await r.text();
            console.log('\nSTATUS',r.status,'URL',r.url,'HEADERS',JSON.stringify(headers,null,2),'BODY_LEN',body.length,'BODY',body.slice(0,10000));
            const ids=[...body.matchAll(/\b\d{17,20}\b/g)].map(m=>m[0]);
            const urls=[...body.matchAll(/https?:\/\/[^"'<>\s]+/g)].map(m=>m[0]);
            console.log('NUMERIC_IDS',ids.slice(0,50));
            console.log('BODY_URLS',urls.slice(0,50));
          }
          NODE
      - run: echo raw-redirect-probe-v1
